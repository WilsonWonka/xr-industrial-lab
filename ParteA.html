<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Laboratorio XR - Escena Básica</title>
  <!-- Librería de A-Frame incluida en el head -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Cubo azul -->
    <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>

    <!-- Esfera roja -->
    <a-sphere position="2 1 -4" radius="1" color="#EF2D5E"></a-sphere>

    <!-- Cilindro amarillo -->
    <a-cylinder position="-2 0.75 -4" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

    <!-- Piso verde rotado -90° en el eje X -->
    <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

    <!-- Fondo gris claro -->
    <a-sky color="#ECECEC"></a-sky>
  </a-scene>
</body>
</html>
