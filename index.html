<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Laboratorio XR - Parte D: Modelo CAD Integrado</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Carga previa de recursos -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <a-sky color="#2C3E50"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#34495E"></a-plane>

    <!-- Visualización del modelo CAD de GrabCAD -->
    <a-entity gltf-model="#modeloIndustrial" position="0 0 -5" scale="1 1 1"></a-entity>
  </a-scene>
</body>
</html>
