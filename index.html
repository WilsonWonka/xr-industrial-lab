<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Laboratorio XR - Parte D: Modelo CAD Ajustado</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Carga previa de recursos -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- Iluminación para resaltar el modelo -->
    <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
    <a-light type="directional" color="#FFFFFF" intensity="0.7" position="-1 4 2"></a-light>

    <!-- Fondo y Piso -->
    <a-sky color="#2C3E50"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#34495E"></a-plane>

    <!-- BASE BLANCA (Pedestal) -->
    <a-cylinder position="0 0.2 -5" radius="1.2" height="0.4" color="#FFFFFF" material="roughness: 0.3"></a-cylinder>

    <!-- BRAZO ROBÓTICO (Escalado y posicionado sobre la base) -->
    <a-entity 
      gltf-model="#modeloIndustrial" 
      position="0 0.4 -5" 
      scale="0.6 0.6 0.6"
      rotation="0 0 0">
    </a-entity>
  </a-scene>
</body>
</html>
